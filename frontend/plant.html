<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7ef" />
    <title>Растение — Plantory</title>
    <link rel="stylesheet" href="css/style.css" />

    <style>
      .plant-page {
        width: min(100% - 40px, 1100px);
        margin: 32px auto 72px;
      }

      .plant-back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 22px;
        color: var(--green);
        text-decoration: none;
        font-weight: 600;
        transition:
          opacity 0.2s ease,
          transform 0.2s ease;
      }

      .plant-back:hover {
        opacity: 0.75;
        transform: translateX(-3px);
      }

      .plant-detail {
        padding: 32px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: #fffef9;
        box-shadow: 0 12px 40px rgba(35, 60, 40, 0.06);
      }

      .plant-detail-top {
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
        gap: 36px;
        align-items: center;
      }

      .plant-detail-top > div {
        min-width: 0;
      }

      .plant-detail-image {
        display: block;
        width: 100%;
        height: 390px;
        object-fit: cover;
        border-radius: 18px;
        background: #e9eee4;
      }

      .plant-detail .eyebrow {
        display: inline-block;
        margin-bottom: 10px;
        color: #718269;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1.8px;
      }

      .plant-detail h1 {
        margin: 0 0 12px;
        color: var(--green);
        font-family: "Playfair Display", serif;
        font-size: clamp(34px, 5vw, 52px);
        line-height: 1.12;
        overflow-wrap: anywhere;
      }

      .plant-detail-scientific {
        margin: 0 0 20px;
        color: #687364;
        font-size: 16px;
        font-style: italic;
      }

      .plant-detail-top p:not(.plant-detail-scientific) {
        color: var(--muted);
        font-size: 16px;
        line-height: 1.85;
        overflow-wrap: anywhere;
      }

      .plant-detail section {
        margin-top: 36px;
        padding: 24px 26px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: #f8f7f0;
      }

      .plant-detail section h2 {
        margin: 0 0 16px;
        color: var(--green);
        font-family: "Playfair Display", serif;
        font-size: clamp(23px, 3vw, 29px);
        line-height: 1.3;
      }

      .plant-detail section p {
        margin: 0;
        color: var(--muted);
        line-height: 1.8;
      }

      .plant-detail-list {
        display: grid;
        gap: 12px;
        margin: 0;
        padding-left: 22px;
        color: #495548;
        line-height: 1.8;
      }

      .plant-detail-list li {
        padding-left: 4px;
        overflow-wrap: anywhere;
      }

      .plant-detail section:nth-of-type(2) {
        background: #f0f6ec;
        border-color: #dce8d5;
      }

      .plant-detail section:nth-of-type(3) {
        background: #fbf1eb;
        border-color: #efded2;
      }

      .plant-detail-message {
        padding: 28px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: #fffef9;
        color: var(--muted);
        line-height: 1.7;
      }

      @media (max-width: 700px) {
        .plant-page {
          width: min(100% - 28px, 1100px);
          margin: 22px auto 44px;
        }

        .plant-detail {
          padding: 18px;
          border-radius: 18px;
        }

        .plant-detail-top {
          grid-template-columns: 1fr;
          gap: 22px;
        }

        .plant-detail-image {
          height: 280px;
        }

        .plant-detail section {
          margin-top: 22px;
          padding: 20px;
          border-radius: 14px;
        }

        .plant-detail-scientific {
          font-size: 14px;
        }

        .plant-detail-top p:not(.plant-detail-scientific) {
          font-size: 15px;
        }
      }

      @media (max-width: 400px) {
        .plant-detail {
          padding: 14px;
        }

        .plant-detail-image {
          height: 230px;
        }

        .plant-detail section {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main class="plant-page">
      <a class="plant-back" href="index.html#catalog">← Назад в каталог</a>
      <div id="plant-content" class="plant-detail-message" aria-live="polite">
        Загружаем информацию о растении…
      </div>
    </main>
    <script src="js/plant.js"></script>
  </body>
</html>
